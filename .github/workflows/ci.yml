name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        # The delimiter, BOM and path-safety code is the kind that breaks on a
        # different platform, so cover Windows and macOS on one version.
        include:
          - python-version: "3.13"
            os: windows-latest
          - python-version: "3.13"
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests demo.py

      - name: Ruff format
        run: ruff format --check src tests demo.py

  server:
    name: Server starts and advertises its tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e .

      # Unit tests never touch the MCP layer, so verify over the real protocol
      # that the server launches and exposes the tool it claims to.
      - name: Handshake over stdio
        run: |
          python - <<'PY'
          import anyio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              params = StdioServerParameters(command="mcp-data-profiler", args=[])
              async with stdio_client(params) as (read, write):
                  async with ClientSession(read, write) as session:
                      info = await session.initialize()
                      tools = (await session.list_tools()).tools
                      names = [t.name for t in tools]
                      print("server:", info.server_info.name, info.server_info.version)
                      print("tools:", names)
                      assert names == ["profile_dataset"], names

          anyio.run(main)
          PY
